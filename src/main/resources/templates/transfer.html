<!DOCTYPE html>

<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Transfert</title>


    <link rel="stylesheet" th:href="@{/css/transfer.css}">

</head>

<body>

<div class="container">


    <header>

        <div class="logo">
            Pay My Buddy
        </div>

        <nav>
            <a href="/transfer" class="active">Transférer</a>
            <a href="/profile">Profil</a>
            <a href="/add-connection">Ajouter relation</a>
            <a href="/logout">Se déconnecter</a>
        </nav>

    </header>

    <section class="transfer-form">

        <section class="transfer-form">

            <form method="post" action="/transfer">

                <select name="receiverId" required>

                    <option value="">
                        Sélectionner une relation
                    </option>

                    <option
                            th:each="connection : ${connections}"
                            th:value="${connection.connection.idUser}"
                            th:text="${connection.connection.email}">
                    </option>

                </select>

                <input
                        type="text"
                        name="description"
                        placeholder="Description"
                        required>

                <input
                        type="number"
                        step="0.01"
                        name="amount"
                        placeholder="0€"
                        required>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit">
                    Payer
                </button>

            </form>

        </section>

    </section>

    <section class="transactions">

        <h2>Mes Transactions</h2>

        <table>

            <thead>
            <tr>
                <th>Relations</th>
                <th>Description</th>
                <th>Montant</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="transaction : ${transactions}">

                <td th:text="${transaction.receiver.email}">
                    Relation
                </td>

                <td th:text="${transaction.description}">
                    Description
                </td>

                <td th:text="${transaction.amount}">
                    Montant
                </td>

            </tr>

            </tbody>

        </table>

    </section>

</div>

</body>

</html>
