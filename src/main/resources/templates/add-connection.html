<!DOCTYPE html>

<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter une relation</title>

    <link rel="stylesheet" th:href="@{/css/add-connection.css}">

</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            Pay My Buddy
        </div>

        <nav>
            <a href="/transfer">Transférer</a>
            <a href="/profile">Profil</a>
            <a href="/add-connection" class="active">Ajouter relation</a>
            <a href="/logout">Se déconnecter</a>
        </nav>

    </header>

    <div class="form-container">

        <h2>Ajouter une relation</h2>

        <form method="post" action="/add-connection">

            <input
                    type="email"
                    name="email"
                    placeholder="Adresse e-mail"
                    required>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
                Ajouter
            </button>

        </form>

    </div>

</div>

</body>

</html>
